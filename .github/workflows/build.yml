name: Build The Absent File

on:
  workflow_dispatch:

env:
  RENPY_VERSION: "8.3.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ekstrak zip proyek dan cari folder game
        run: |
          set -e
          mkdir -p work/unzipped
          ZIP=$(ls *.zip | head -n 1)
          echo "Memakai zip: $ZIP"
          unzip -q "$ZIP" -d work/unzipped
          GAMEDIR=$(find work/unzipped -type d -name game | head -n 1)
          echo "Folder game ditemukan: $GAMEDIR"
          mkdir -p work/project
          cp -r "$GAMEDIR" work/project/game

      - name: Unduh Ren'Py SDK
        run: |
          set -e
          wget -q "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          tar -xjf "renpy-${RENPY_VERSION}-sdk.tar.bz2"
          mv "renpy-${RENPY_VERSION}-sdk" sdk
          ls sdk

      - name: Tambahkan template bawaan (tanpa menimpa file kita)
        run: |
          set -e
          cp -rn sdk/gui/game/. work/project/game/
          ls work/project/game

      - name: Lint (cek kesalahan skrip)
        run: |
          cd sdk
          ./renpy.sh launcher lint ../work/project 2>&1 | tee ../lint.txt

      - name: Siapkan Android SDK dan keystore
        run: |
          set -e
          cd sdk/rapt
          yes | python3 android.py installsdk 2>&1 | tee ../../installsdk.txt
          keytool -genkey -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 20000 \
            -storepass android -keypass android -dname "CN=TheAbsentFile"

      - name: Tulis konfigurasi Android
        run: |
          cat > work/project/.android.json <<'JSON'
          {
            "package": "com.vano.theabsentfile",
            "name": "The Absent File",
            "icon_name": "The Absent File",
            "version": "0.1.0",
            "numeric_version": "1",
            "orientation": "sensorLandscape",
            "permissions": ["VIBRATE"],
            "include_pil": false,
            "include_sqlite": false,
            "layout": null,
            "source": false,
            "expansion": false,
            "store": "none",
            "update_always": true,
            "update_icons": true,
            "update_keystores": true,
            "google_play_key": null,
            "google_play_salt": null
          }
          JSON

      - name: Build APK
        run: |
          cd sdk/rapt
          python3 android.py build ../../work/project assembleRelease 2>&1 | tee ../../build.txt

      - name: Kumpulkan APK
        if: always()
        run: |
          mkdir -p out
          find . -name "*.apk" -not -path "./sdk/rapt/project/*" -exec cp {} out/ \; || true
          ls out

      - name: Unggah hasil dan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-build
          path: |
            out/
            lint.txt
            installsdk.txt
            build.txt
